spring.application.name=urlshortner

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── PostgreSQL / Neon ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.ssl=true

# update = creates/alters tables automatically but never drops — safe for this project
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
# Disabled: Spring Boot 4.x / Flyway 11 has a compatibility issue with
# Neon's channel_binding URL parameter that causes migrations to be silently skipped.
spring.flyway.enabled=false

# ─── Redis / Upstash ──────────────────────────────────────────────────────────
# Upstash exposes a full rediss:// URI – use it directly
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# ─── Application ──────────────────────────────────────────────────────────────
app.base-url=${BASE_URL:https://bitly.com/}
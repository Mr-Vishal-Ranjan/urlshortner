spring.application.name=urlshortner

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── PostgreSQL / Neon ────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.ssl=true

# Schema managed by Flyway — never let Hibernate auto-alter production DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── Redis / Upstash ──────────────────────────────────────────────────────────
# Upstash exposes a full rediss:// URI – use it directly
spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# ─── Application ──────────────────────────────────────────────────────────────
app.base-url=${BASE_URL:https://bitly.com/}